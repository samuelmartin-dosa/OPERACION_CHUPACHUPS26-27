<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operación Chupachups</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#fbf6f8; --surface:#ffffff; --fg:#2a1a24; --muted:#7a6571; --line:#ecdde5;
  --candy:#e0245e; --stick:#f2b705; --ok:#1f8a4c; --err:#c62828;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1b1218; --surface:#251a21; --fg:#f6e9ef; --muted:#b39aa8; --line:#3a2a33;
  --candy:#ff5c8a; --stick:#ffcf3a; --ok:#4cc985; --err:#ff7a7a; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:32px 16px 56px;display:grid;gap:28px}
.eyebrow{font:600 .75rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase}
h1{font:800 clamp(2rem,6vw,3.4rem)/1.02 var(--display);margin:6px 0 0;text-wrap:balance}
h2{font:800 1.4rem/1.2 var(--display);margin:0}
.hero{background:var(--candy);color:#fff;border-radius:28px;padding:28px clamp(18px,4vw,36px);display:grid;gap:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.18) 0 20deg,transparent 20deg 40deg);pointer-events:none}
.hero .eyebrow{color:#ffe3ec}
.clock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.unit{background:rgba(255,255,255,.14);border-radius:16px;padding:14px 8px;text-align:center}
.unit b{display:block;font:700 clamp(2rem,8vw,3.6rem)/1 var(--mono);font-variant-numeric:tabular-nums}
.unit span{font:600 .72rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.msg{font:600 1.05rem/1.4 var(--body);margin:0}
.target{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.9rem}
.target input{font:500 .95rem var(--mono);border:0;border-radius:10px;padding:8px 10px;background:var(--stick);color:#2a1a24}
.target input:disabled{opacity:1}
.meta{font:500 .8rem var(--mono);opacity:.8}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px clamp(14px,3vw,26px);display:grid;gap:16px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
.total{font:700 .95rem var(--mono);color:var(--muted)}
.total b{color:var(--candy);font-size:1.3rem}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font:600 .85rem var(--body);border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--candy);color:var(--candy)}
button:focus-visible,input:focus-visible{outline:2px solid var(--candy);outline-offset:2px}
button[aria-pressed="true"],button.primary{background:var(--candy);border-color:var(--candy);color:#fff}
button:disabled{opacity:.5;cursor:default}
ul{list-style:none;margin:0;padding:0;display:grid}
li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.name{min-width:0;font-weight:600}
.pops{display:block;margin-top:4px;font-size:.9rem;letter-spacing:2px;color:var(--candy);min-height:1em;overflow-wrap:anywhere}
.zero .name{color:var(--muted);font-weight:400}
.ctr{display:flex;align-items:center;gap:6px}
.ctr button{width:34px;height:34px;padding:0;font-size:1.1rem;line-height:1}
.ctr output{font:700 1.15rem var(--mono);font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
body:not(.admin) .ctr button{display:none}
.admin-bar{display:grid;gap:10px;border:1px dashed var(--line);border-radius:16px;padding:14px}
.admin-bar input{font:500 .9rem var(--mono);padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:.9rem;margin:0}
.status.ok{color:var(--ok)} .status.err{color:var(--err)}
.note{font-size:.85rem;color:var(--muted);margin:0}
footer{display:flex;justify-content:flex-end}
@media (prefers-reduced-motion:no-preference){.tick{animation:pop .25s ease}@keyframes pop{50%{transform:scale(1.25)}}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div>
      <div class="eyebrow">Cuenta atrás</div>
      <h1>Operación Chupachups</h1>
    </div>
    <div class="clock">
      <div class="unit"><b id="d">00</b><span>Días</span></div>
      <div class="unit"><b id="h">00</b><span>Horas</span></div>
      <div class="unit"><b id="m">00</b><span>Minutos</span></div>
      <div class="unit"><b id="s">00</b><span>Segundos</span></div>
    </div>
    <p class="msg" id="msg">Cargando…</p>
    <div class="target">
      <label for="when">Fecha y hora objetivo</label>
      <input type="datetime-local" id="when" disabled>
      <span class="meta" id="secs"></span>
    </div>
  </section>

  <section class="panel">
    <div class="head">
      <h2>Chupachups por alumno</h2>
      <div class="total">Total <b id="total">0</b></div>
    </div>
    <div class="tools">
      <button id="sortList">Orden original</button>
      <button id="sortRank">Ranking</button>
      <button id="sortAlpha">A–Z</button>
    </div>

    <div class="admin-bar" id="adminBar" hidden>
      <div class="row" id="tokenRow">
        <label for="token" style="flex-basis:100%">Token de GitHub (solo la primera vez en este navegador)</label>
        <input type="password" id="token" placeholder="github_pat_…" autocomplete="off" style="flex:1 1 240px">
        <button id="saveToken">Recordar token</button>
      </div>
      <div class="row">
        <button class="primary" id="saveGh" disabled>Guardar cambios en GitHub</button>
        <button id="forget">Olvidar token</button>
        <button id="exitAdmin">Salir del modo profesor</button>
      </div>
      <p class="status" id="status"></p>
    </div>

    <ul id="list"></ul>
    <p class="note" id="note"></p>
  </section>

  <footer><button id="enterAdmin">Modo profesor</button></footer>
</div>

<script>
/* ===== Configuración =====
   Si la página está en https://USUARIO.github.io/REPO/ se detecta sola.
   Si usas otro dominio, rellena OWNER y REPO a mano. */
const CONFIG = {
  OWNER: "",          // p. ej. "mi-usuario"
  REPO: "",           // p. ej. "operacion-chupachups"
  BRANCH: "main",
  FILE: "datos.json"
};
(function detect(){
  const host = location.hostname;
  if (!CONFIG.OWNER && host.endsWith(".github.io")) CONFIG.OWNER = host.split(".")[0];
  if (!CONFIG.REPO && host.endsWith(".github.io")) {
    const first = location.pathname.split("/").filter(Boolean)[0];
    CONFIG.REPO = first && !first.endsWith(".html") ? first : host;
  }
})();

const $ = id => document.getElementById(id);
let data = null, sort = "list", dirty = false;
const TOKEN_KEY = "chupachups-token";
const getToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch(e) { return ""; } };

/* ===== Carga de datos ===== */
async function loadData(){
  // 1) API de GitHub (versión más reciente, sin caché). 2) Si falla, el datos.json servido por Pages.
  if (CONFIG.OWNER && CONFIG.REPO) {
    try {
      const r = await fetch(`https://api.github.com/repos/${CONFIG.OWNER}/${CONFIG.REPO}/contents/${CONFIG.FILE}?ref=${CONFIG.BRANCH}&t=${Date.now()}`,
        { headers: authHeaders() , cache: "no-store" });
      if (r.ok) { const j = await r.json(); return JSON.parse(b64decode(j.content)); }
    } catch(e) {}
  }
  const r = await fetch(`${CONFIG.FILE}?t=${Date.now()}`, { cache: "no-store" });
  if (!r.ok) throw new Error("No se encontró " + CONFIG.FILE);
  return r.json();
}
function authHeaders(){
  const t = getToken();
  const h = { "Accept": "application/vnd.github+json" };
  if (t) h.Authorization = "Bearer " + t;
  return h;
}
const b64decode = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")), c => c.charCodeAt(0)));
const b64encode = s => { const bytes = new TextEncoder().encode(s); let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };

/* ===== Cuenta atrás ===== */
const pad = n => String(n).padStart(2,"0");
const fmtDate = d => d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"}) + " a las " + d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}) + " h";
function tick(){
  if (!data) return;
  const target = new Date(data.objetivo);
  if (isNaN(target)) { $("msg").textContent = "La fecha objetivo no es válida."; return; }
  const secs = Math.max(0, Math.floor((target - Date.now()) / 1000));
  const d = Math.floor(secs/86400), h = Math.floor(secs%86400/3600), m = Math.floor(secs%3600/60), s = secs%60;
  $("d").textContent = pad(d); $("h").textContent = pad(h); $("m").textContent = pad(m); $("s").textContent = pad(s);
  $("secs").textContent = secs.toLocaleString("es-ES") + " s restantes";
  $("msg").textContent = secs === 0 ? "¡Ha llegado el momento! Operación Chupachups en marcha."
    : (d === 1 ? "Falta 1 día" : "Faltan " + d + " días") + " hasta el " + fmtDate(target) + ".";
}
setInterval(tick, 1000);

/* ===== Lista ===== */
function render(){
  const rows = data.alumnos.map((a,i) => ({ i, ...a }));
  if (sort === "rank") rows.sort((a,b) => b.chupachups - a.chupachups || a.i - b.i);
  if (sort === "alpha") rows.sort((a,b) => a.nombre.localeCompare(b.nombre,"es"));
  $("list").innerHTML = rows.map(r => `<li class="${r.chupachups ? "" : "zero"}">
    <div class="name">${esc(r.nombre)}<span class="pops" aria-hidden="true">${"●".repeat(Math.min(r.chupachups,30))}</span></div>
    <div class="ctr"><button data-i="${r.i}" data-d="-1" aria-label="Quitar uno">−</button>
    <output>${r.chupachups}</output>
    <button data-i="${r.i}" data-d="1" aria-label="Añadir uno">+</button></div></li>`).join("");
  $("total").textContent = data.alumnos.reduce((a,b) => a + b.chupachups, 0);
  [["list","sortList"],["rank","sortRank"],["alpha","sortAlpha"]].forEach(([k,id]) => $(id).setAttribute("aria-pressed", sort === k));
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function markDirty(){ dirty = true; $("saveGh").disabled = false; setStatus("Hay cambios sin guardar.", ""); }

$("list").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || !document.body.classList.contains("admin")) return;
  const a = data.alumnos[+b.dataset.i];
  a.chupachups = Math.max(0, a.chupachups + Number(b.dataset.d));
  render(); markDirty();
});
$("when").addEventListener("input", () => { data.objetivo = $("when").value; tick(); markDirty(); });
$("sortList").onclick = () => { sort = "list"; render(); };
$("sortRank").onclick = () => { sort = "rank"; render(); };
$("sortAlpha").onclick = () => { sort = "alpha"; render(); };

/* ===== Modo profesor ===== */
function setStatus(t, cls){ const s = $("status"); s.textContent = t; s.className = "status " + (cls || ""); }
function setAdmin(on){
  document.body.classList.toggle("admin", on);
  $("adminBar").hidden = !on;
  $("enterAdmin").hidden = on;
  $("when").disabled = !on;
  $("tokenRow").hidden = !!getToken();
  if (on && !(CONFIG.OWNER && CONFIG.REPO)) setStatus("No se ha podido detectar el repositorio. Rellena OWNER y REPO en index.html.", "err");
}
$("enterAdmin").onclick = () => setAdmin(true);
$("exitAdmin").onclick = () => {
  if (dirty) { setStatus("Tienes cambios sin guardar. Guárdalos o recarga la página para descartarlos.", "err"); return; }
  setAdmin(false);
};
$("saveToken").onclick = () => {
  const t = $("token").value.trim();
  if (!t) { setStatus("Pega primero el token.", "err"); return; }
  try { localStorage.setItem(TOKEN_KEY, t); } catch(e) {}
  $("token").value = ""; $("tokenRow").hidden = true;
  setStatus("Token guardado en este navegador.", "ok");
};
$("forget").onclick = () => { try { localStorage.removeItem(TOKEN_KEY); } catch(e) {} $("tokenRow").hidden = false; setStatus("Token borrado de este navegador.", ""); };

$("saveGh").onclick = async () => {
  if (!getToken()) { setStatus("Falta el token de GitHub.", "err"); $("tokenRow").hidden = false; return; }
  const url = `https://api.github.com/repos/${CONFIG.OWNER}/${CONFIG.REPO}/contents/${CONFIG.FILE}`;
  $("saveGh").disabled = true; setStatus("Guardando…", "");
  try {
    const cur = await fetch(`${url}?ref=${CONFIG.BRANCH}&t=${Date.now()}`, { headers: authHeaders(), cache: "no-store" });
    if (!cur.ok) throw new Error(cur.status === 401 ? "El token no es válido." : cur.status === 404 ? "No encuentro el repositorio o el archivo. Revisa OWNER, REPO y los permisos del token." : "Error " + cur.status + " al leer el archivo.");
    const { sha } = await cur.json();
    const body = { message: "Actualizar Operación Chupachups", content: b64encode(JSON.stringify(data, null, 2) + "\n"), sha, branch: CONFIG.BRANCH };
    const r = await fetch(url, { method: "PUT", headers: { ...authHeaders(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(r.status === 403 ? "El token no tiene permiso de escritura (Contents: Read and write)." : r.status === 409 ? "Alguien cambió el archivo a la vez. Recarga la página y repite el cambio." : "Error " + r.status + " al guardar.");
    dirty = false;
    setStatus("Guardado. Todos verán los cambios al recargar la página.", "ok");
  } catch(e) {
    $("saveGh").disabled = false;
    setStatus(e.message, "err");
  }
};
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

/* ===== Inicio ===== */
loadData().then(d => {
  data = d; $("when").value = data.objetivo; render(); tick();
  $("note").textContent = "Datos guardados en el repositorio. Se actualizan para todos cuando el profesor guarda.";
}).catch(e => { $("msg").textContent = "No se pudieron cargar los datos: " + e.message; });
</script>
</body>
</html>
